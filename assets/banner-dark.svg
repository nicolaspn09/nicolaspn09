<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Nícolas Paulo Nasário - Senior AI &amp; Automation Engineer</title>
  <desc id="desc">Senior AI and Automation Engineer. Autonomous Agents, Mission-Critical RPA, and Resilient Architectures. Jedi Archives Edition.</desc>
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1325" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-dark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad-dark)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid-dark)" />

  <!-- Jedi Order Crest / Kyber Holocron Watermark in Background -->
  <g transform="translate(1010, 190) scale(0.75)" opacity="0.08" stroke="#38bdf8" fill="none" stroke-width="3">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="100" stroke-dasharray="10,6" />
    <circle cx="0" cy="0" r="70" />
    <!-- Central Blade of Light -->
    <line x1="0" y1="-115" x2="0" y2="115" stroke-width="4" />
    <!-- Stylized Jedi Wings -->
    <path d="M -15 20 C -45 10, -75 -20, -75 -65 C -60 -40, -35 -25, 0 -15 C 35 -25, 60 -40, 75 -65 C 75 -20, 45 10, 15 20 Z" />
    <path d="M -10 40 C -35 30, -55 10, -60 -15 C -45 5, -25 15, 0 20 C 25 15, 45 5, 60 -15 C 55 10, 35 30, 10 40 Z" />
    <!-- Sunburst Diamond -->
    <polygon points="0,-125 8,-105 0,-85 -8,-105" fill="#38bdf8" />
  </g>

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="1160" height="340" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Cyber Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 330 L 20 360 L 50 360" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 360 L 1180 360 L 1180 330" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Top Telemetry Bar with text-anchor="end" to NEVER overflow -->
  <g class="font-mono" font-size="11" letter-spacing="1.5">
    <circle cx="52" cy="45" r="4" fill="#10b981" filter="url(#glow-filter)" />
    <text x="65" y="49" fill="#10b981" font-weight="600">JEDI ARCHIVES ONLINE // SYSTEMS IN EQUILIBRIUM</text>
    <text x="1140" y="49" text-anchor="end" fill="#64748b" font-weight="500">JEDI ARCHIVES · KYBER CORE [NODE: NP-09]</text>
  </g>

  <!-- Divider Line with Kyber Glow -->
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#1e293b" stroke-width="1" />
  <line x1="200" y1="68" x2="1000" y2="68" stroke="url(#cyan-glow)" stroke-width="2" />

  <!-- Center Content -->
  <!-- Name -->
  <text class="font-hud" x="60" y="145" fill="#f8fafc" font-size="44" font-weight="900" letter-spacing="3">
    NÍCOLAS PAULO NASÁRIO
  </text>

  <!-- Primary Title (AI FIRST) -->
  <text class="font-hud" x="60" y="195" fill="#38bdf8" font-size="22" font-weight="700" letter-spacing="2">
    SENIOR AI &amp; AUTOMATION ENGINEER
  </text>

  <!-- Mission Subtitle -->
  <text class="font-hud" x="60" y="235" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.5">
    Autonomous Agentic Systems · Mission-Critical RPA · Resilient Backend Architecture
  </text>

  <!-- Quote Principle (Obi-Wan Kenobi & Luke Skywalker Heritage) -->
  <g class="font-mono" font-size="12" fill="#64748b" letter-spacing="1">
    <text x="60" y="270" fill="#38bdf8" font-weight="600">&gt; &quot;In my experience, there is no such thing as luck.&quot;</text>
    <text x="460" y="270" fill="#64748b">— Sincronização, idempotência e tolerância a falhas por design.</text>
  </g>

  <!-- Technical Capability Pills -->
  <g class="font-mono" font-size="11" font-weight="600" letter-spacing="1">
    <rect x="60" y="300" width="195" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="76" cy="315" r="3" fill="#38bdf8" />
    <text x="88" y="320" fill="#cbd5e1">AGENT ORCHESTRATION</text>

    <rect x="270" y="300" width="195" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="286" cy="315" r="3" fill="#38bdf8" />
    <text x="298" y="320" fill="#cbd5e1">CREWAI / LANGGRAPH</text>

    <rect x="480" y="300" width="200" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="496" cy="315" r="3" fill="#38bdf8" />
    <text x="508" y="320" fill="#cbd5e1">MISSION-CRITICAL RPA</text>

    <rect x="695" y="300" width="180" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="711" cy="315" r="3" fill="#38bdf8" />
    <text x="723" y="320" fill="#cbd5e1">MCP &amp; RAG ENGINES</text>

    <rect x="890" y="300" width="220" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="906" cy="315" r="3" fill="#38bdf8" />
    <text x="918" y="320" fill="#cbd5e1">PYTHON HIGH-CONCURRENCY</text>
  </g>
</svg>
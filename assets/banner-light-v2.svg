<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title-l desc-l">
  <title id="title-l">Nícolas Paulo Nasário - Senior AI &amp; Automation Engineer</title>
  <desc id="desc-l">Senior AI and Automation Engineer. Autonomous Agents, Mission-Critical RPA, and Resilient Architectures. Rebel Alliance / Jedi Edition.</desc>
  <defs>

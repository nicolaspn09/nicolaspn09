<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="title-l desc-l">
  <title id="title-l">Nícolas Paulo Nasário - Senior AI &amp; Automation Engineer</title>
  <desc id="desc-l">Senior AI and Automation Engineer. Autonomous Agents, Mission-Critical RPA, and Resilient Architectures. Jedi Archives Edition.</desc>
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <pattern id="grid-light" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
    <filter id="saber-glow-hero-light" x="-10%" y="-150%" width="120%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="glow1" />
      <feGaussianBlur stdDeviation="1.5" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="390" rx="16" fill="url(#bg-grad-light)" />
  <rect width="1200" height="390" rx="16" fill="url(#grid-light)" />

  <!-- Jedi Order Crest Watermark -->
  <g transform="translate(1010, 200) scale(0.75)" opacity="0.06" stroke="#0284c7" fill="none" stroke-width="3">
    <circle cx="0" cy="0" r="100" stroke-dasharray="10,6" />
    <circle cx="0" cy="0" r="70" />
    <line x1="0" y1="-115" x2="0" y2="115" stroke-width="4" />
    <path d="M -15 20 C -45 10, -75 -20, -75 -65 C -60 -40, -35 -25, 0 -15 C 35 -25, 60 -40, 75 -65 C 75 -20, 45 10, 15 20 Z" />
    <path d="M -10 40 C -35 30, -55 10, -60 -15 C -45 5, -25 15, 0 20 C 25 15, 45 5, 60 -15 C 55 10, 35 30, 10 40 Z" />
    <polygon points="0,-125 8,-105 0,-85 -8,-105" fill="#0284c7" />
  </g>

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="1160" height="350" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Cyber Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 340 L 20 370 L 50 370" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 370 L 1180 370 L 1180 340" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Top Telemetry Bar with text-anchor="end" -->
  <g class="font-mono" font-size="11" letter-spacing="1.5">
    <circle cx="52" cy="45" r="4" fill="#059669" />
    <text x="65" y="49" fill="#059669" font-weight="600">JEDI ARCHIVES ONLINE // SYSTEMS IN EQUILIBRIUM</text>
    <text x="1140" y="49" text-anchor="end" fill="#64748b" font-weight="500">JEDI ARCHIVES · KYBER CORE [NODE: NP-09]</text>
  </g>

  <!-- ======================================================== -->
  <!-- LUKE SKYWALKER'S EMERALD LIGHTSABER (HERO DIVIDER BEAM)  -->
  <!-- ======================================================== -->
  <g transform="translate(45, 60)">
    <!-- Hilt -->
    <rect x="0" y="4" width="7" height="10" rx="1.5" fill="#64748b" stroke="#334155" stroke-width="0.8" />
    <rect x="7" y="5" width="34" height="8" rx="1" fill="#1e293b" stroke="#0f172a" stroke-width="0.8" />
    <line x1="12" y1="5" x2="12" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="17" y1="5" x2="17" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="22" y1="5" x2="22" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="27" y1="5" x2="27" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="32" y1="5" x2="32" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="37" y1="5" x2="37" y2="13" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="18" y="1" width="13" height="4.5" rx="0.5" fill="#d97706" stroke="#b45309" stroke-width="0.6" />
    <line x1="20" y1="3" x2="29" y2="3" stroke="#fef08a" stroke-width="0.6" />
    <rect x="41" y="6.5" width="10" height="5" rx="0.5" fill="#b45309" stroke="#78350f" stroke-width="0.8" />
    <path d="M 51 5 L 61 3 L 63 3 L 63 15 L 61 15 L 51 13 Z" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />

    <!-- Plasma Blade -->
    <g filter="url(#saber-glow-hero-light)">
      <line x1="64" y1="9" x2="1105" y2="9" stroke="#059669" stroke-width="6" stroke-linecap="round" opacity="0.35" />
      <line x1="64" y1="9" x2="1105" y2="9" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.9" />
      <line x1="64" y1="9" x2="1104" y2="9" stroke="#ecfdf5" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Center Content -->
  <text class="font-hud" x="60" y="150" fill="#0f172a" font-size="44" font-weight="900" letter-spacing="3">
    NÍCOLAS PAULO NASÁRIO
  </text>

  <text class="font-hud" x="60" y="200" fill="#0284c7" font-size="22" font-weight="700" letter-spacing="2">
    SENIOR AI &amp; AUTOMATION ENGINEER
  </text>

  <text class="font-hud" x="60" y="240" fill="#475569" font-size="15" font-weight="400" letter-spacing="0.5">
    Autonomous Agentic Systems · Mission-Critical RPA · Resilient Backend Architecture
  </text>

  <g class="font-mono" font-size="12" fill="#64748b" letter-spacing="1">
    <text x="60" y="275" fill="#059669" font-weight="600">&gt; &quot;In my experience, there is no such thing as luck.&quot;</text>
    <text x="460" y="275" fill="#64748b">— Sincronização, idempotência e tolerância a falhas por design.</text>
  </g>

  <g class="font-mono" font-size="11" font-weight="600" letter-spacing="1">
    <rect x="60" y="305" width="195" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="76" cy="320" r="3" fill="#0284c7" />
    <text x="88" y="325" fill="#1e293b">AGENT ORCHESTRATION</text>

    <rect x="270" y="305" width="175" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="286" cy="320" r="3" fill="#0284c7" />
    <text x="298" y="325" fill="#1e293b">CREWAI / LANGGRAPH</text>

    <rect x="460" y="305" width="180" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="476" cy="320" r="3" fill="#0284c7" />
    <text x="488" y="325" fill="#1e293b">MISSION-CRITICAL RPA</text>

    <rect x="655" y="305" width="165" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="671" cy="320" r="3" fill="#0284c7" />
    <text x="683" y="325" fill="#1e293b">MCP &amp; RAG ENGINES</text>

    <rect x="835" y="305" width="205" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="851" cy="320" r="3" fill="#0284c7" />
    <text x="863" y="325" fill="#1e293b">PYTHON HIGH-CONCURRENCY</text>
  </g>
</svg>
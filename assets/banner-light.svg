<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title-l desc-l">
  <title id="title-l">Nícolas Paulo Nasário - Senior AI &amp; Automation Engineer</title>
  <desc id="desc-l">Senior AI and Automation Engineer. Autonomous Agents, Mission-Critical RPA, and Resilient Architectures.</desc>
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="blue-glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-light" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad-light)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid-light)" />

  <!-- Outer HUD Frame -->
  <rect x="20" y="20" width="1160" height="340" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Cyber Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 20 L 1180 20 L 1180 50" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 20 330 L 20 360 L 50 360" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
  <path d="M 1150 360 L 1180 360 L 1180 330" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

  <!-- Top Telemetry Bar -->
  <g class="font-mono" font-size="11" letter-spacing="1.5">
    <circle cx="52" cy="45" r="4" fill="#059669" />
    <text x="65" y="49" fill="#059669" font-weight="600">JEDI ARCHIVES ONLINE // SYSTEMS IN EQUILIBRIUM</text>
    <text x="820" y="49" fill="#64748b" font-weight="500">JEDI ARCHIVES · KYBER CORE PROTOCOLS [NODE: NP-09]</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#e2e8f0" stroke-width="1" />
  <line x1="200" y1="68" x2="1000" y2="68" stroke="url(#blue-glow-light)" stroke-width="2" />

  <!-- Center Content -->
  <!-- Name -->
  <text class="font-hud" x="60" y="145" fill="#0f172a" font-size="44" font-weight="900" letter-spacing="3">
    NÍCOLAS PAULO NASÁRIO
  </text>

  <!-- Primary Title -->
  <text class="font-hud" x="60" y="195" fill="#0284c7" font-size="22" font-weight="700" letter-spacing="2">
    SENIOR AI &amp; AUTOMATION ENGINEER
  </text>

  <!-- Mission Subtitle -->
  <text class="font-hud" x="60" y="235" fill="#475569" font-size="15" font-weight="400" letter-spacing="0.5">
    Autonomous Agentic Systems · Mission-Critical RPA · Resilient Backend Architecture
  </text>

  <!-- Quote Principle -->
  <g class="font-mono" font-size="12" fill="#64748b" letter-spacing="1">
    <text x="60" y="270" fill="#0284c7" font-weight="600">&gt; &quot;In my experience, there is no such thing as luck.&quot;</text>
    <text x="460" y="270" fill="#64748b">— Sincronização, idempotência e tolerância a falhas por design.</text>
  </g>

  <!-- Technical Capability Pills -->
  <g class="font-mono" font-size="11" font-weight="600" letter-spacing="1">
    <rect x="60" y="300" width="195" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="76" cy="315" r="3" fill="#0284c7" />
    <text x="88" y="320" fill="#1e293b">AGENT ORCHESTRATION</text>

    <rect x="270" y="300" width="195" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="286" cy="315" r="3" fill="#0284c7" />
    <text x="298" y="320" fill="#1e293b">CREWAI / LANGGRAPH</text>

    <rect x="480" y="300" width="200" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="496" cy="315" r="3" fill="#0284c7" />
    <text x="508" y="320" fill="#1e293b">MISSION-CRITICAL RPA</text>

    <rect x="695" y="300" width="180" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="711" cy="315" r="3" fill="#0284c7" />
    <text x="723" y="320" fill="#1e293b">MCP &amp; RAG ENGINES</text>

    <rect x="890" y="300" width="220" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="906" cy="315" r="3" fill="#0284c7" />
    <text x="918" y="320" fill="#1e293b">PYTHON HIGH-CONCURRENCY</text>
  </g>
</svg>
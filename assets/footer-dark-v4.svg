<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="f-d-t f-d-d">
  <title id="f-d-t">May the Force be with you - Luke Skywalker Emerald Lightsaber &amp; Tatooine Binary Sunset</title>
  <desc id="f-d-d">O sabre de luz verde de Luke Skywalker e os sóis gêmeos de Tatooine com a Aliança Rebelde.</desc>
  <defs>
    <linearGradient id="ft-sky-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091326" />
      <stop offset="100%" stop-color="#0f1a36" />
    </linearGradient>
    <radialGradient id="sun1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="170" rx="14" fill="url(#ft-sky-dark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Rebel Alliance Starbird Subtle Watermark in Center-Left -->
  <g transform="translate(80, 20) scale(0.42)" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2">
    <path d="M7.42,145.986C9.185,99.193,32.899,56.035,76.25,27.516c0.128,0.048,1.251-0.361,0.738,0.61 c-3.434,3.184-65.172,76.114-8.344,133.68c0,0,29.858,28.704,53.011,1.468c0,0,22.847-29.577-0.289-74.413 c0,0-5.856-14.64-26.955-23.721l16.992-18.748c0,0,14.359,6.161,25.478,22.871c0,0,0.593-17.593-12.884-36.34l26.345-29.89 l26.08,29.609c0,0-11.993,16.991-12.876,36.902c0,0,8.191-13.477,25.776-23.151l16.686,18.748c0,0-16.045,5.287-26.794,23.529 c-9.242,16.902-16.357,53.05,0.416,75.223c0,0,18.772,26.618,51.792-1.571c0,0,60.712-54.399-6.226-133.048 c0,0-3.658-3.233,0.449-1.476c29.586,21.54,65.012,49.946,68.67,120.837c-1.444,85.966-59.012,147.334-143.074,147.334 C68.934,295.968,4.95,227.283,7.42,145.986" />
  </g>

  <!-- Distant Stars -->
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="70" cy="25" r="0.8" />
    <circle cx="130" cy="45" r="1" />
    <circle cx="210" cy="20" r="0.7" />
    <circle cx="340" cy="35" r="1.1" />
    <circle cx="480" cy="18" r="0.8" />
    <circle cx="560" cy="40" r="0.7" />
    <circle cx="680" cy="22" r="1" />
    <circle cx="770" cy="38" r="0.7" />
    <circle cx="860" cy="15" r="0.9" />
    <circle cx="920" cy="32" r="0.8" />
    <circle cx="1120" cy="20" r="1" />
  </g>

  <!-- Tatooine Binary Sunset (Top Right Horizon) -->
  <g transform="translate(1040, 52)">
    <circle cx="0" cy="0" r="28" fill="url(#sun1-glow)" />
    <circle cx="0" cy="0" r="13" fill="#fef08a" />
    <circle cx="50" cy="22" r="21" fill="url(#sun2-glow)" />
    <circle cx="50" cy="22" r="9" fill="#fda4af" />
  </g>

  <!-- Desert Dunes of Tatooine -->
  <path d="M 0 170 L 0 138 Q 200 118, 450 133 T 850 126 Q 1020 113, 1200 128 L 1200 170 Z" fill="#090e1c" opacity="0.95" />
  <path d="M 0 170 L 0 148 Q 300 136, 600 150 T 1200 143 L 1200 170 Z" fill="#04060c" />

  <!-- ========================================== -->
  <!-- LUKE SKYWALKER'S EMERALD LIGHTSABER (ROTJ) -->
  <!-- Centered, proportional hilt + blade (340px)-->
  <!-- ========================================== -->
  <g transform="translate(430, 32)">
    <rect x="0" y="3" width="9" height="14" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <circle cx="3" cy="10" r="2" fill="#1e293b" />
    <rect x="9" y="4" width="40" height="12" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <line x1="15" y1="4" x2="15" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="21" y1="4" x2="21" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="27" y1="4" x2="27" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="33" y1="4" x2="33" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="39" y1="4" x2="39" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="45" y1="4" x2="45" y2="16" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="22" y="-1" width="16" height="6" rx="0.8" fill="#b45309" stroke="#d97706" stroke-width="0.8" />
    <line x1="25" y1="2" x2="35" y2="2" stroke="#fef08a" stroke-width="0.8" />
    <rect x="49" y="6" width="14" height="8" rx="0.8" fill="#d97706" stroke="#92400e" stroke-width="1" />
    <line x1="56" y1="6" x2="56" y2="14" stroke="#f59e0b" stroke-width="0.8" />
    <path d="M 63 4 L 75 2 L 78 2 L 78 18 L 75 18 L 63 16 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
    <rect x="78" y="5" width="3" height="10" rx="0.5" fill="#94a3b8" />

    <!-- 260px Proportional Blade -->
    <rect x="80" y="0" width="260" height="20" rx="10" fill="#10b981" fill-opacity="0.35" />
    <rect x="80" y="4" width="258" height="12" rx="6" fill="#22c55e" fill-opacity="0.80" />
    <rect x="80" y="7" width="256" height="6" rx="3" fill="#4ade80" fill-opacity="0.95" />
    <rect x="80" y="8.75" width="254" height="2.5" rx="1.25" fill="#ffffff" fill-opacity="1.0" />

    <ellipse cx="82" cy="10" rx="8" ry="13" fill="#22c55e" fill-opacity="0.75" />
    <ellipse cx="82" cy="10" rx="4" ry="8" fill="#86efac" fill-opacity="0.9" />
    <ellipse cx="82" cy="10" rx="2" ry="5" fill="#ffffff" />

    <circle cx="340" cy="10" r="7" fill="#10b981" fill-opacity="0.45" />
    <circle cx="340" cy="10" r="4.5" fill="#22c55e" fill-opacity="0.85" />
    <circle cx="340" cy="10" r="2" fill="#ffffff" />
  </g>

  <!-- Center Text (Philosophy) -->
  <g transform="translate(600, 0)">
    <text x="0" y="90" text-anchor="middle" fill="#22c55e" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
      &gt; &quot;MAY THE FORCE BE WITH YOU.&quot;
    </text>
    <text x="0" y="115" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      REBEL ALLIANCE · ARQUITETURA DEFENSIVA POR DESIGN · CONHECIMENTO, RESILIÊNCIA E EQUILÍBRIO
    </text>
    <text x="0" y="138" text-anchor="middle" fill="#475569" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">
      // TATOOINE HORIZON · LUKE SKYWALKER ARCHIVE NODE 09
    </text>
  </g>
</svg>
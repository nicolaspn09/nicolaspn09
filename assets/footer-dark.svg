<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="f-d-t f-d-d">
  <title id="f-d-t">May the Force be with you - Tatooine Binary Sunset</title>
  <desc id="f-d-d">Os sóis gêmeos de Tatooine e a filosofia de Luke Skywalker e da Ordem Jedi.</desc>
  <defs>
    <linearGradient id="ft-sky-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <radialGradient id="sun1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="150" rx="14" fill="url(#ft-sky-dark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Starfield (Subtle distant stars) -->
  <g fill="#e2e8f0" opacity="0.4">
    <circle cx="80" cy="25" r="0.8" />
    <circle cx="140" cy="45" r="1" />
    <circle cx="230" cy="20" r="0.7" />
    <circle cx="340" cy="35" r="1.2" />
    <circle cx="480" cy="18" r="0.9" />
    <circle cx="560" cy="40" r="0.8" />
    <circle cx="680" cy="22" r="1.1" />
    <circle cx="770" cy="38" r="0.7" />
    <circle cx="860" cy="15" r="1" />
    <circle cx="920" cy="32" r="0.8" />
    <circle cx="1120" cy="20" r="1" />
    <circle cx="1160" cy="45" r="0.7" />
  </g>

  <!-- Tatooine Binary Sunset (The Two Suns of Luke Skywalker) -->
  <g transform="translate(1010, 52)">
    <!-- Primary Sun (Tatooine I - Gold) -->
    <circle cx="0" cy="0" r="28" fill="url(#sun1-glow)" />
    <circle cx="0" cy="0" r="13" fill="#fef08a" />
    <!-- Secondary Sun (Tatooine II - Rose Amber) -->
    <circle cx="52" cy="22" r="22" fill="url(#sun2-glow)" />
    <circle cx="52" cy="22" r="9" fill="#fda4af" />
  </g>

  <!-- Desert Horizon / Dunes of Tatooine (Smooth minimalist silhouettes) -->
  <path d="M 0 150 L 0 120 Q 200 100, 450 115 T 850 108 Q 1020 95, 1200 110 L 1200 150 Z" fill="#090e1c" opacity="0.95" />
  <path d="M 0 150 L 0 130 Q 300 118, 600 132 T 1200 125 L 1200 150 Z" fill="#04060c" />

  <!-- Center Text (Jedi Philosophy) -->
  <g transform="translate(600, 0)">
    <text x="0" y="58" text-anchor="middle" fill="#38bdf8" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
      &gt; &quot;MAY THE FORCE BE WITH YOU.&quot;
    </text>
    <text x="0" y="85" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5">
      JEDI ARCHIVES · ARQUITETURA DEFENSIVA POR DESIGN · CONHECIMENTO, RESILIÊNCIA E EQUILÍBRIO
    </text>
    <text x="0" y="112" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="10" letter-spacing="2">
      // TATOOINE HORIZON · LUKE SKYWALKER ARCHIVE NODE 09
    </text>
  </g>
</svg>
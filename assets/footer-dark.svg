<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="f-t f-d">
  <title id="f-t">This is the Way</title>
  <desc id="f-d">Fechamento do perfil de engenharia com telemetria Star Wars.</desc>
  <defs>
    <linearGradient id="ft-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
  </defs>

  <rect width="1200" height="130" rx="14" fill="url(#ft-grad-dark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Decorative Glow Line -->
  <line x1="300" y1="20" x2="900" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="600" cy="20" r="3" fill="#38bdf8" />

  <!-- Quote -->
  <text x="600" y="62" text-anchor="middle" fill="#38bdf8" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
    &gt; &quot;THIS IS THE WAY.&quot;
  </text>

  <!-- Telemetry Subtitle -->
  <text x="600" y="92" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5">
    SISTEMAS RESILIENTES POR DESIGN · CONSTRUÍDO PARA ESCALAR EM PRODUÇÃO · HOLONET NODE 09
  </text>
</svg>
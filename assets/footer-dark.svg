<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="f-j-t f-j-d">
  <title id="f-j-t">May the Force be with you</title>
  <desc id="f-j-d">Fechamento do perfil inspirado na disciplina dos Arquivos Jedi e Luke Skywalker.</desc>
  <defs>
    <linearGradient id="ft-jedi-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0a1528" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="kyber-line-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="130" rx="14" fill="url(#ft-jedi-dark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Kyber Saber Beam Divider -->
  <line x1="250" y1="22" x2="950" y2="22" stroke="url(#kyber-line-dark)" stroke-width="2" />
  <circle cx="600" cy="22" r="3.5" fill="#38bdf8" />

  <!-- Jedi Philosophical Quote (Luke Skywalker / Jedi Wisdom) -->
  <text x="600" y="64" text-anchor="middle" fill="#38bdf8" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
    &gt; &quot;MAY THE FORCE BE WITH YOU.&quot;
  </text>

  <!-- Subtitle: Jedi Archives & Defensive Engineering -->
  <text x="600" y="94" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5">
    JEDI ARCHIVES · ARQUITETURA DEFENSIVA POR DESIGN · CONHECIMENTO, RESILIÊNCIA E EQUILÍBRIO · KYBER NODE 09
  </text>
</svg>
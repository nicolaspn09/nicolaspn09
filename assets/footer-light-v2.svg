<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="f-l-t f-l-d">
  <title id="f-l-t">May the Force be with you - Luke Skywalker Emerald Lightsaber &amp; Tatooine Binary Sunset</title>
  <desc id="f-l-d">O sabre de luz verde de Luke Skywalker e os sóis gêmeos de Tatooine.</desc>
  <defs>
    <linearGradient id="ft-sky-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <radialGradient id="sun1-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun2-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </radialGradient>
    <filter id="green-blade-glow-footer-light" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="170" rx="14" fill="url(#ft-sky-light)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Tatooine Binary Sunset -->
  <g transform="translate(1040, 52)">
    <circle cx="0" cy="0" r="28" fill="url(#sun1-glow-l)" />
    <circle cx="0" cy="0" r="13" fill="#fef08a" />
    <circle cx="50" cy="22" r="21" fill="url(#sun2-glow-l)" />
    <circle cx="50" cy="22" r="9" fill="#fda4af" />
  </g>

  <!-- Dunes -->
  <path d="M 0 170 L 0 138 Q 200 118, 450 133 T 850 126 Q 1020 113, 1200 128 L 1200 170 Z" fill="#93c5fd" opacity="0.4" />
  <path d="M 0 170 L 0 148 Q 300 136, 600 150 T 1200 143 L 1200 170 Z" fill="#60a5fa" opacity="0.5" />

  <!-- LUKE SKYWALKER'S EMERALD LIGHTSABER (ROTJ) -->
  <g transform="translate(180, 30)">
    <rect x="0" y="5" width="8" height="12" rx="1.5" fill="#64748b" stroke="#334155" stroke-width="0.8" />
    <circle cx="2.5" cy="11" r="1.5" fill="#1e293b" />
    <rect x="8" y="6" width="38" height="10" rx="1" fill="#1e293b" stroke="#0f172a" stroke-width="0.8" />
    <line x1="14" y1="6" x2="14" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="20" y1="6" x2="20" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="26" y1="6" x2="26" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="32" y1="6" x2="32" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="38" y1="6" x2="38" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="22" y="2" width="14" height="5" rx="0.5" fill="#d97706" stroke="#b45309" stroke-width="0.6" />
    <line x1="24" y1="4.5" x2="34" y2="4.5" stroke="#fef08a" stroke-width="0.7" />
    <rect x="46" y="8" width="12" height="6" rx="0.5" fill="#b45309" stroke="#78350f" stroke-width="0.8" />
    <path d="M 58 6 L 68 4 L 70 4 L 70 18 L 68 18 L 58 16 Z" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />

    <g filter="url(#green-blade-glow-footer-light)">
      <line x1="72" y1="11" x2="800" y2="11" stroke="#059669" stroke-width="6.5" stroke-linecap="round" opacity="0.4" />
      <line x1="72" y1="11" x2="800" y2="11" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
      <line x1="72" y1="11" x2="799" y2="11" stroke="#ecfdf5" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <g transform="translate(600, 0)">
    <text x="0" y="80" text-anchor="middle" fill="#047857" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
      &gt; &quot;MAY THE FORCE BE WITH YOU.&quot;
    </text>
    <text x="0" y="106" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      JEDI ARCHIVES · ARQUITETURA DEFENSIVA POR DESIGN · CONHECIMENTO, RESILIÊNCIA E EQUILÍBRIO
    </text>
    <text x="0" y="132" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">
      // TATOOINE HORIZON · LUKE SKYWALKER ARCHIVE NODE 09
    </text>
  </g>
</svg>
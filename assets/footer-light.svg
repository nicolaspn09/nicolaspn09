    </text>
    <text x="0" y="120" text-anchor="middle" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="10" letter-spacing="2">
      // TATOOINE HORIZON · LUKE SKYWALKER EMERALD LIGHTSABER · NODE 09

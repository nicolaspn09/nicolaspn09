  <defs>
    <linearGradient id="ft-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="130" rx="14" fill="url(#ft-grad-light)" stroke="#cbd5e1" stroke-width="1.5" />

  <line x1="300" y1="20" x2="900" y2="20" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="600" cy="20" r="3" fill="#0284c7" />

  <text x="600" y="62" text-anchor="middle" fill="#0284c7" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">

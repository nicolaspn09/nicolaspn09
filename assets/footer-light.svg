<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-labelledby="f-l-t f-l-d">
  <title id="f-l-t">May the Force be with you - Luke Skywalker Emerald Lightsaber &amp; Tatooine Binary Sunset</title>
  <desc id="f-l-d">O sabre de luz verde de Luke Skywalker e os sóis gêmeos de Tatooine.</desc>
  <defs>
    <linearGradient id="ft-sky-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <radialGradient id="sun1-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sun2-glow-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef2f2" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#be123c" stop-opacity="0" />
    </radialGradient>
    <filter id="green-blade-glow-l" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="1.2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="160" rx="14" fill="url(#ft-sky-light)" stroke="#cbd5e1" stroke-width="1.5" />

  <g transform="translate(1030, 48)">
    <circle cx="0" cy="0" r="26" fill="url(#sun1-glow-l)" />
    <circle cx="0" cy="0" r="12" fill="#fde047" />
    <circle cx="48" cy="20" r="20" fill="url(#sun2-glow-l)" />
    <circle cx="48" cy="20" r="8" fill="#fb7185" />
  </g>

  <path d="M 0 160 L 0 130 Q 200 110, 450 125 T 850 118 Q 1020 105, 1200 120 L 1200 160 Z" fill="#e2e8f0" opacity="0.95" />
  <path d="M 0 160 L 0 140 Q 300 128, 600 142 T 1200 135 L 1200 160 Z" fill="#cbd5e1" />

  <g transform="translate(240, 24)">
    <rect x="0" y="5" width="8" height="12" rx="1.5" fill="#64748b" stroke="#334155" stroke-width="0.8" />
    <rect x="8" y="6" width="38" height="10" rx="1" fill="#1e293b" stroke="#0f172a" stroke-width="0.8" />
    <line x1="14" y1="6" x2="14" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="20" y1="6" x2="20" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="26" y1="6" x2="26" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="32" y1="6" x2="32" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <line x1="38" y1="6" x2="38" y2="16" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="22" y="2" width="14" height="5" rx="0.5" fill="#d97706" stroke="#b45309" stroke-width="0.6" />
    <line x1="24" y1="4.5" x2="34" y2="4.5" stroke="#fef08a" stroke-width="0.7" />
    <rect x="46" y="8" width="12" height="6" rx="0.5" fill="#d97706" stroke="#b45309" stroke-width="0.8" />
    <path d="M 58 6 L 68 4 L 70 4 L 70 18 L 68 18 L 58 16 Z" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />

    <g filter="url(#green-blade-glow-l)">
      <line x1="72" y1="11" x2="720" y2="11" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.4" />
      <line x1="72" y1="11" x2="720" y2="11" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" opacity="0.85" />
      <line x1="72" y1="11" x2="719" y2="11" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <g transform="translate(600, 0)">
    <text x="0" y="68" text-anchor="middle" fill="#059669" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">

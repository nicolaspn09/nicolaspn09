<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="f-j-tl f-j-dl">
  <title id="f-j-tl">May the Force be with you</title>
  <desc id="f-j-dl">Fechamento do perfil inspirado na disciplina dos Arquivos Jedi e Luke Skywalker.</desc>
  <defs>
    <linearGradient id="ft-jedi-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="kyber-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="130" rx="14" fill="url(#ft-jedi-light)" stroke="#cbd5e1" stroke-width="1.5" />

  <line x1="250" y1="22" x2="950" y2="22" stroke="url(#kyber-line-light)" stroke-width="2" />
  <circle cx="600" cy="22" r="3.5" fill="#0284c7" />

  <text x="600" y="64" text-anchor="middle" fill="#0284c7" font-family="'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" letter-spacing="4">
    &gt; &quot;MAY THE FORCE BE WITH YOU.&quot;
  </text>

  <text x="600" y="94" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1.5">
    JEDI ARCHIVES · ARQUITETURA DEFENSIVA POR DESIGN · CONHECIMENTO, RESILIÊNCIA E EQUILÍBRIO · KYBER NODE 09
  </text>
</svg>
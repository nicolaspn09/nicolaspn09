<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="st-l-t st-l-d">
  <title id="st-l-t">Telemetria &amp; Métricas do Sistema</title>
  <desc id="st-l-d">Métricas consolidadas de repositórios, commits, stack primária e status operacional.</desc>
  <defs>
    <linearGradient id="st-light-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <rect width="1200" height="200" rx="14" fill="url(#st-light-grad)" stroke="#cbd5e1" stroke-width="1.5" />

  <path d="M 18 35 L 18 18 L 35 18" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1165 18 L 1182 18 L 1182 35" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 18 165 L 18 182 L 35 182" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 1165 182 L 1182 182 L 1182 165" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(55, 45)">
    <text class="font-mono" x="0" y="0" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">CONTRIBUIÇÕES EM 2026</text>
    <text class="font-hud" x="0" y="46" fill="#0284c7" font-size="44" font-weight="900" letter-spacing="1">940+</text>
    <text class="font-hud" x="0" y="76" fill="#475569" font-size="12">Commits contínuos no GitHub</text>
  </g>

  <line x1="330" y1="35" x2="330" y2="165" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(365, 45)">
    <text class="font-mono" x="0" y="0" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">REPOSITÓRIOS NO AR</text>
    <text class="font-hud" x="0" y="46" fill="#0f172a" font-size="44" font-weight="900" letter-spacing="1">118</text>
    <text class="font-hud" x="0" y="76" fill="#475569" font-size="12">Soluções de IA, RPA e APIs</text>
  </g>

  <line x1="635" y1="35" x2="635" y2="165" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(670, 45)">
    <text class="font-mono" x="0" y="0" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">CORE ECOSYSTEM</text>
    <text class="font-hud" x="0" y="46" fill="#059669" font-size="44" font-weight="900" letter-spacing="1">Python</text>
    <text class="font-hud" x="0" y="76" fill="#475569" font-size="12">&gt; 85% do código em produção</text>
  </g>

  <line x1="940" y1="35" x2="940" y2="165" stroke="#e2e8f0" stroke-width="1" />

  <g transform="translate(975, 45)">
    <text class="font-mono" x="0" y="0" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1.5">SISTEMA / STATUS</text>
    <text class="font-hud" x="0" y="46" fill="#0284c7" font-size="38" font-weight="900" letter-spacing="2">ACTIVE</text>
    <text class="font-hud" x="0" y="76" fill="#475569" font-size="12">Engenharia de Alta Escala</text>
  </g>

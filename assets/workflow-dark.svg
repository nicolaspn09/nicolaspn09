<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" role="img" aria-labelledby="wf-t wf-d">
  <title id="wf-t">Metodologia de Engenharia Agêntica &amp; Automação Defensiva</title>
  <desc id="wf-d">Pipeline de cinco etapas da especificação arquitetural ao deploy conteinerizado com telemetria.</desc>
  <defs>
    <linearGradient id="card-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <style>
    .font-hud { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <rect width="1100" height="370" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text class="font-hud" x="40" y="42" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">
    PIPELINE DE ENGENHARIA AGÊNTICA &amp; DEFENSIVA
  </text>
  <text class="font-mono" x="760" y="42" fill="#64748b" font-size="11" letter-spacing="1">
    // SPEC-DRIVEN DEVELOPMENT WORKFLOW
  </text>
  <line x1="40" y1="60" x2="1060" y2="60" stroke="#1e293b" stroke-width="1" />

  <!-- Card 1 -->
  <g transform="translate(40, 78)">
    <rect width="185" height="260" rx="8" fill="url(#card-grad-dark)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="185" height="5" rx="2" fill="#38bdf8" />
    <text class="font-mono" x="14" y="28" fill="#38bdf8" font-size="11" font-weight="700">FASE 01</text>
    <text class="font-hud" x="14" y="52" fill="#f8fafc" font-size="14" font-weight="700">
      <tspan x="14" dy="0">Especificação &amp;</tspan>
      <tspan x="14" dy="18">PRD de Contrato</tspan>
    </text>
    <text class="font-hud" x="14" y="102" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">Modelagem estrita de</tspan>
      <tspan x="14" dy="16">dados, contratos de API,</tspan>
      <tspan x="14" dy="16">isolamento de escopo</tspan>
      <tspan x="14" dy="16">e mapeamento de</tspan>
      <tspan x="14" dy="16">casos de borda.</tspan>
    </text>
    <rect x="14" y="215" width="120" height="24" rx="4" fill="#030712" stroke="#334155" />
    <text class="font-mono" x="22" y="231" fill="#38bdf8" font-size="9" font-weight="600">HUMANO-LIDERADO</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 235 205 L 255 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Card 2 -->
  <g transform="translate(255, 78)">
    <rect width="185" height="260" rx="8" fill="url(#card-grad-dark)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="5" rx="2" fill="#0284c7" />
    <text class="font-mono" x="14" y="28" fill="#38bdf8" font-size="11" font-weight="700">FASE 02</text>
    <text class="font-hud" x="14" y="52" fill="#f8fafc" font-size="14" font-weight="700">
      <tspan x="14" dy="0">Ferramentas &amp;</tspan>
      <tspan x="14" dy="18">MCP Servers</tspan>
    </text>
    <text class="font-hud" x="14" y="102" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">Criação de protocolos</tspan>
      <tspan x="14" dy="16">MCP, sandboxing de</tspan>
      <tspan x="14" dy="16">tools, isolamento de</tspan>
      <tspan x="14" dy="16">memória e redução</tspan>
      <tspan x="14" dy="16">de alucinação.</tspan>
    </text>
    <rect x="14" y="215" width="110" height="24" rx="4" fill="#030712" stroke="#334155" />
    <text class="font-mono" x="22" y="231" fill="#cbd5e1" font-size="9" font-weight="600">TOOL CALLING</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 450 205 L 470 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Card 3 -->
  <g transform="translate(470, 78)">
    <rect width="185" height="260" rx="8" fill="url(#card-grad-dark)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <rect x="0" y="0" width="185" height="5" rx="2" fill="#38bdf8" />
    <text class="font-mono" x="14" y="28" fill="#38bdf8" font-size="11" font-weight="700">FASE 03</text>
    <text class="font-hud" x="14" y="52" fill="#f8fafc" font-size="14" font-weight="700">
      <tspan x="14" dy="0">Orquestração</tspan>
      <tspan x="14" dy="18">Multiagente</tspan>
    </text>
    <text class="font-hud" x="14" y="102" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">Pipelines concorrentes</tspan>
      <tspan x="14" dy="16">em CrewAI &amp; LangGraph.</tspan>
      <tspan x="14" dy="16">Agentes atuam com</tspan>
      <tspan x="14" dy="16">contexto isolado e</tspan>
      <tspan x="14" dy="16">tarefas atômicas.</tspan>
    </text>
    <rect x="14" y="215" width="115" height="24" rx="4" fill="#030712" stroke="#334155" />
    <text class="font-mono" x="22" y="231" fill="#38bdf8" font-size="9" font-weight="600">MULTI-AGENTES</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 665 205 L 685 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Card 4 -->
  <g transform="translate(685, 78)">
    <rect width="185" height="260" rx="8" fill="url(#card-grad-dark)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="5" rx="2" fill="#10b981" />
    <text class="font-mono" x="14" y="28" fill="#10b981" font-size="11" font-weight="700">FASE 04</text>
    <text class="font-hud" x="14" y="52" fill="#f8fafc" font-size="14" font-weight="700">
      <tspan x="14" dy="0">Guardrails &amp;</tspan>
      <tspan x="14" dy="18">Evals Defensivos</tspan>
    </text>
    <text class="font-hud" x="14" y="102" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">Validação Pydantic,</tspan>
      <tspan x="14" dy="16">checagem semântica,</tspan>
      <tspan x="14" dy="16">subagentes revisores</tspan>
      <tspan x="14" dy="16">e testes de carga</tspan>
      <tspan x="14" dy="16">em produção.</tspan>
    </text>
    <rect x="14" y="215" width="115" height="24" rx="4" fill="#030712" stroke="#334155" />
    <text class="font-mono" x="22" y="231" fill="#10b981" font-size="9" font-weight="600">TEST &amp; REVISÃO</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 880 205 L 900 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Card 5 -->
  <g transform="translate(900, 78)">
    <rect width="160" height="260" rx="8" fill="url(#card-grad-dark)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="5" rx="2" fill="#f59e0b" />
    <text class="font-mono" x="14" y="28" fill="#f59e0b" font-size="11" font-weight="700">FASE 05</text>
    <text class="font-hud" x="14" y="52" fill="#f8fafc" font-size="14" font-weight="700">
      <tspan x="14" dy="0">Deploy &amp;</tspan>
      <tspan x="14" dy="18">Telemetria</tspan>
    </text>
    <text class="font-hud" x="14" y="102" fill="#94a3b8" font-size="11">
      <tspan x="14" dy="0">Docker containers,</tspan>
      <tspan x="14" dy="16">filas assíncronas,</tspan>
      <tspan x="14" dy="16">logs estruturados e</tspan>
      <tspan x="14" dy="16">observabilidade em</tspan>
      <tspan x="14" dy="16">tempo real.</tspan>
    </text>
    <rect x="14" y="215" width="105" height="24" rx="4" fill="#030712" stroke="#334155" />
    <text class="font-mono" x="22" y="231" fill="#f59e0b" font-size="9" font-weight="600">CI/CD &amp; PROD</text>
  </g>
</svg>